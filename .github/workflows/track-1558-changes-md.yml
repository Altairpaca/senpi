name: track-1558-changes-md

on:
  push:
    branches:
      - automation/track-1558-changes-md

permissions:
  contents: write

jobs:
  update-trackers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add exact-nearest tracker coverage
        shell: bash
        env:
          CORE_ENTRY_B64: 
          COMPACTION_ENTRY_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          entries = {
              Path('packages/coding-agent/src/core/changes.md'): base64.b64decode(os.environ['CORE_ENTRY_B64']).decode(),
              Path('packages/coding-agent/src/core/extensions/builtin/compaction/changes.md'): base64.b64decode(os.environ['COMPACTION_ENTRY_B64']).decode(),
          }
          for path, entry in entries.items():
              text = path.read_text(encoding='utf-8')
              marker = entry.splitlines()[0]
              if marker in text:
                  continue
              first_newline = text.find('\n')
              if first_newline < 0:
                  raise RuntimeError(f'no heading line in {path}')
              updated = text[:first_newline + 1] + '\n' + entry.rstrip() + '\n\n' + text[first_newline + 1:].lstrip('\n')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit tracker coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/changes.md packages/coding-agent/src/core/extensions/builtin/compaction/changes.md
          if git diff --cached --quiet; then
            echo "trackers already current"
            exit 0
          fi
          git commit -m "docs(changes): track OpenCode compaction attribution"
          git push origin HEAD:automation/track-1558-changes-md
