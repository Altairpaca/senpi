name: track-1421-changes-md

on:
  push:
    branches:
      - automation/track-1421-changes-md

permissions:
  contents: write

jobs:
  update-tracker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add exact-nearest tracker coverage
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('packages/ai/src/changes.md')
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode()
          text = path.read_text(encoding='utf-8')
          marker = entry.splitlines()[0]
          if marker not in text:
              first_newline = text.find('\n')
              if first_newline < 0:
                  raise RuntimeError(f'no heading line in {path}')
              updated = text[:first_newline + 1] + '\n' + entry.rstrip() + '\n\n' + text[first_newline + 1:].lstrip('\n')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit tracker coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/changes.md
          if git diff --cached --quiet; then
            echo "tracker already current"
            exit 0
          fi
          git commit -m "docs(changes): track tool-result image normalization"
          git push origin HEAD:automation/track-1421-changes-md
